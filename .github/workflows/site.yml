name: Documentation site

# Builds the site (docs/site/, zensical.toml) and publishes it to GitHub Pages from the gh-pages
# branch. Adapted from lmmx/mibz2's site.yml, less its benchmark-history data, its API
# reference and its page screenshots (`look`), which upigz doesn't have yet.
#
# Production (pushes to master) goes to the root of gh-pages, served at
# https://lmmx.github.io/upigz/ once the repository's Pages source is set to "Deploy from a
# branch", branch gh-pages, folder / (the first production run creates the branch). Each pull
# request from this repository that touches the site gets a preview under
# gh-pages/pr-preview/pr-<number>/, linked from a comment on the pull request. Previews are
# deployed only once Pages serves the gh-pages branch (the pages job reads the Pages build
# type: "legacy" is a branch source); until then the preview job is skipped.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - ".github/workflows/site.yml"
      - "docs/journal/**"
      - "docs/overrides/**"
      - "docs/scripts/**"
      - "docs/site/**"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The docs toolchain, pinned (as in .just/docs.just: change both together)
  DOCS_WITH: >-
    --with zensical==0.0.71
    --with ruff==0.17.1
  PAGES_URL: https://lmmx.github.io/upigz/

jobs:
  # "legacy" once Pages serves a branch; "unknown" while Pages is not enabled.
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          case "${build_type}" in
            legacy | workflow) ;;
            *) build_type=unknown ;;
          esac
          echo "Pages build type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Version the site's own assets
        run: sed -i "s|?v=dev\"|?v=${GITHUB_SHA::12}\"|" zensical.toml
      - name: Point the site at its preview path
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ env.PAGES_URL }}pr-preview/pr-${{ github.event.pull_request.number }}/
        run: sed -i "s|^site_url = .*|site_url = \"${PREVIEW_URL}\"|" zensical.toml
      # the charts and results.json must match runs/ (docs/scripts/figures.py)
      - name: Check the result charts are up to date
        run: python3 docs/scripts/figures.py --check
      # --strict fails on broken links, anchors and cross-references
      - name: Build
        run: uv run --no-project -p 3.13 ${DOCS_WITH} zensical build --clean --strict
      - name: Check the nav, internal links and llms.txt
        run: uv run --no-project -p 3.13 python docs/scripts/check_site.py
      - name: Check for Markdown that rendered as something else
        run: uv run --no-project -p 3.13 python docs/scripts/check_render.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  # Production, on the gh-pages branch (created by the first run).
  deploy-branch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Serve the files as built, without Jekyll.
      - run: touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy the documentation site from ${{ github.sha }}

  # Pull request previews. Only for pull requests from this repository: a fork's workflow
  # has a read-only token, and this job runs none of the pull request's code, only the
  # built files from the build job.
  preview:
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.pages.outputs.build_type == 'legacy'
      && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: [pages, build]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read
      pull-requests: write
    steps:
      # The deploy step needs a checkout to work in; the default branch, not the pull request.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"
          # Not the action's own wait: it follows the Pages build of this push alone (below).
          wait-for-pages-deployment: false
      # Pages builds gh-pages once per push, and a push landing while a build runs cancels
      # that build: the next one publishes both pushes' files, but the first push's own build
      # reads as failed. Each deploy touches only its own path, so wait for the outcome
      # instead: the preview serving this run's files, whose assets carry ?v=<commit> (the
      # build job's "Version the site's own assets"). A query string per request gets past
      # the Pages cache.
      - name: Wait until the preview serves this build
        if: github.event.action != 'closed'
        env:
          URL: ${{ env.PAGES_URL }}pr-preview/pr-${{ github.event.pull_request.number }}/
        run: |
          want="?v=${GITHUB_SHA::12}\""
          for i in $(seq 1 80); do
            if curl -fsS "${URL}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}" | grep -qF "${want}"; then
              echo "The preview serves this build: ${URL}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The preview did not serve this build (${want}) within 20 minutes: ${URL}"
          exit 1
