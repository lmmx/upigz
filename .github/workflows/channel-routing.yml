# The routing tripwire for the agent team's channel (docs/team/PROTOCOL.md), with
# .github/coordination/coord.py. Adapted from lmmx/mibz2's.
#
# The coordinator's assignments go to a role's inbox, or are staged on the channel PR as
# TYPE: QUEUED while the role is busy; the channel PR wakes only the coordinator. On each new
# comment on the channel (#2) or an inbox (#3-#9), the tripwire checks the header against that routing. A
# correct comment ends the run silently; a misrouted one gets one failing check run on the
# channel PR's head commit, named for the comment. It is a visible record, not a wake-up: the
# coordinator finds misroutes itself with `coord.py audit` (CLAUDE.md). The tripwire never
# edits, deletes, moves or re-posts a comment, and skips bots.
name: Channel routing

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/coordination/**"
      - ".github/workflows/channel-routing.yml"
  push:
    branches: [master]
    paths:
      - ".github/coordination/**"
      - ".github/workflows/channel-routing.yml"

permissions:
  contents: read

jobs:
  tripwire:
    # the channel #2 and the inboxes #3-#9 (coord.py's CHANNEL and ROLES: keep them in step)
    if: >-
      github.event_name == 'issue_comment' &&
      contains(fromJSON('[2, 3, 4, 5, 6, 7, 8, 9]'), github.event.issue.number) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/coordination
      - name: Check the comment's routing
        env:
          # untrusted text: only ever read from the environment, never interpolated
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          warning=$(printf '%s' "$BODY" | python3 .github/coordination/coord.py warn --issue "$ISSUE" --comment-id "$COMMENT")
          if [ -z "$warning" ]; then
            echo "comment $COMMENT on #$ISSUE: routed correctly"
            exit 0
          fi
          echo "::warning::comment $COMMENT on #$ISSUE is misrouted"
          printf '%s\n' "$warning"
          name="routing tripwire: comment $COMMENT"
          head=$(gh api "repos/$REPO/pulls/2" --jq .head.sha)
          seen=$(gh api -X GET "repos/$REPO/commits/$head/check-runs" -f check_name="$name" --jq .total_count)
          if [ "$seen" != 0 ]; then
            echo "already flagged on the channel ($head)"
            exit 0
          fi
          gh api "repos/$REPO/check-runs" -f name="$name" -f head_sha="$head" \
            -f status=completed -f conclusion=failure \
            -f "output[title]=Misrouted: comment $COMMENT on #$ISSUE" \
            -f "output[summary]=$warning" --jq .html_url

  tests:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/coordination
      - name: Unit tests
        run: python3 -m unittest discover -s .github/coordination -v
