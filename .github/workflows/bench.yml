# The decoder benchmark: one gzip member decoded whole by upigz and the other gzip decoders,
# in shuffled paired rounds on one runner (bench/ci_bench.py), in lmmx/mibz2's result shape
# (bench/report.py).
#
# - A pull request: its head against its base (the merge base with master), both built here
#   and run as two arms (`upigz` and `upigz@base`) of one harness, at 1, 2 and 4 threads, in
#   an order shuffled each round. Its figures are the run's summary and its artifact
#   (`bench-pr-<head>`), which bench-links.yml keeps, once the pull request merges, as a link
#   of the history's chain (bench/links.py). Nothing else from a pull request is recorded.
# - A push to master: the commit's upigz against rapidgzip (at 1, 2 and 4 threads) and
#   igzip, libdeflate, pigz and gzip (at 1 thread), its result kept on the bench-results
#   branch (a data-only branch, never merged; nothing is committed to master). The site's
#   benchmark pages are built from it (site.yml, docs/scripts/bench_history.py).
# - From the Actions tab, `backfill`: master merges (space-separated SHAs), each measured as
#   on master and recorded, and each whose subject names its pull request `(#N)` also run
#   against its first parent and linked (`bench/links.py add`), as if its pull request had
#   been benchmarked: the history's chain for merges from before this workflow ran.
#
# The workload: the first 256 MiB of the dated Wikidata JSON dump of 2026-11-16, whole lines,
# compressed as one member with `gzip -6 -n` (bench/ci_corpus.py, its SHA-256 pinned). It is
# built from a byte range of the dump once and then kept on the bench-data branch, since a
# dated dump leaves Wikimedia after a few months.
name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "csrc/**"
      - "rust-toolchain.toml"
      - "bench/ci_bench.py"
      - "bench/ci_corpus.py"
      - "bench/report.py"
      - ".github/workflows/bench.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "csrc/**"
      - "rust-toolchain.toml"
      - "bench/ci_bench.py"
      - "bench/ci_corpus.py"
      - "bench/report.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Master merges to record and link, space-separated (empty: the ref run from, as on master, not recorded)"
        required: false

# A push to a pull request cancels its run in progress; master's runs each make a record, one
# at a time, so the records append in order
concurrency:
  group: bench-${{ github.event.pull_request.number || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write # (master: the bench-results and bench-data branches)

env:
  ROUNDS: 10
  RAPIDGZIP: "0.16.2"
  CORPUS: wd-256
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CARGO_TERM_COLOR: never

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libisal-dev isal libdeflate-tools pigz > /dev/null
          python3 -m venv /tmp/rg && /tmp/rg/bin/pip install -q "rapidgzip==${RAPIDGZIP}"
          echo "RG=/tmp/rg/bin/rapidgzip" >> "$GITHUB_ENV"
          for t in igzip libdeflate-gunzip pigz gzip /tmp/rg/bin/rapidgzip; do command -v "$t"; done

      - uses: dtolnay/rust-toolchain@1.99.1

      # the corpus: from the bench-data branch, else rebuilt from Wikimedia (and kept there)
      - name: Corpus
        run: |
          mkdir -p corpus
          if git fetch -q origin bench-data:refs/remotes/origin/bench-data 2>/dev/null \
             && git cat-file -e "origin/bench-data:${CORPUS}.json.gz" 2>/dev/null; then
            git show "origin/bench-data:${CORPUS}.json.gz" > "corpus/${CORPUS}.json.gz"
            gzip -dc "corpus/${CORPUS}.json.gz" > "corpus/${CORPUS}.json"
            want=$(sed -nE 's/^RAW_SHA256 = "([0-9a-f]+)"$/\1/p' bench/ci_corpus.py)
            echo "${want}  corpus/${CORPUS}.json" | sha256sum -c -
            echo "CORPUS_SOURCE=kept" >> "$GITHUB_ENV"
          else
            python3 bench/ci_corpus.py build corpus
            echo "CORPUS_SOURCE=wikimedia" >> "$GITHUB_ENV"
          fi
          ls -l corpus

      # each job: a head, a base ("" for figures against the alternatives) and whether it is recorded
      - name: Jobs
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          git fetch -q origin master
          : > jobs.txt
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git fetch -q origin "$PR_HEAD" "$PR_BASE" 2>/dev/null || true
              echo "$PR_HEAD $(git merge-base "$PR_BASE" "$PR_HEAD") 0" >> jobs.txt ;;
            push) echo "$(git rev-parse HEAD) - 1" >> jobs.txt ;;
            *)
              if [ -z "$INPUT_BACKFILL" ]; then echo "$(git rev-parse HEAD) - 0" >> jobs.txt; fi
              for c in $INPUT_BACKFILL; do
                c=$(git rev-parse "$c^{commit}")
                git merge-base --is-ancestor "$c" origin/master || { echo "::error::$c is not on master"; exit 1; }
                echo "$c - 1" >> jobs.txt
                if git show -s --format=%s "$c" | grep -qE '\(#[0-9]+\)\s*$' && git rev-parse -q --verify "$c^1" > /dev/null; then
                  echo "$c $(git rev-parse "$c^1") 1" >> jobs.txt
                fi
              done ;;
          esac
          cat jobs.txt
          # the harness is this checkout's, whichever commits' decoders it runs
          cp -r bench /tmp/harness

      - name: Run
        run: |
          set -euo pipefail
          build() {
            [ -x "/tmp/upigz-$1" ] && return 0
            git -c advice.detachedHead=false checkout -q "$1"
            cargo build --release -q
            cp target/release/upigz "/tmp/upigz-$1"
            git checkout -q -
          }
          mkdir -p results
          while read -r head base record; do
            build "$head"
            if [ "$base" = - ]; then
              out="results/$head"
              python3 /tmp/harness/ci_bench.py run "$out" \
                --corpus "corpus/${CORPUS}.json.gz" --raw "corpus/${CORPUS}.json" \
                --upigz "/tmp/upigz-$head" --rapidgzip "$RG" --rounds "$ROUNDS" \
                --head "$head" --run "$RUN_URL"
            else
              build "$base"
              out="results/pr-$head"
              python3 /tmp/harness/ci_bench.py run "$out" \
                --corpus "corpus/${CORPUS}.json.gz" --raw "corpus/${CORPUS}.json" \
                --upigz "/tmp/upigz-$head" --base-upigz "/tmp/upigz-$base" --rounds "$ROUNDS" \
                --head "$head" --base "$base" --run "$RUN_URL"
            fi
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          done < jobs.txt

      # a pull request's paired result, for bench-links.yml once it merges
      - name: Pull request result
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bench-pr-${{ github.event.pull_request.head.sha }}
          path: |
            results/pr-${{ github.event.pull_request.head.sha }}/result.json
            results/pr-${{ github.event.pull_request.head.sha }}/runs.jsonl
            results/pr-${{ github.event.pull_request.head.sha }}/summary.md
          retention-days: 90

      - name: Results
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_id }}
          path: results
          if-no-files-found: ignore

      # master only: each commit's result appended to the bench-results branch, and the
      # corpus kept on the bench-data branch if it was rebuilt from Wikimedia
      - name: Record
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # (a data-only branch, checked out beside the code: its last commit, or a new one)
          open_branch() {
            if git fetch -q origin "$1:refs/remotes/origin/$1" 2>/dev/null; then
              git worktree add -q --detach "$2" "origin/$1"
            else
              git worktree add -q --orphan -b "$1" "$2"
            fi
          }
          push_branch() {
            for try in 1 2 3; do
              git -C "$2" push -q origin "HEAD:$1" && return 0
              git -C "$2" fetch -q origin "$1" && git -C "$2" rebase -q FETCH_HEAD
            done
            return 1
          }
          open_branch bench-results .store
          recorded=0
          while read -r head base record; do
            [ "$record" = 1 ] || continue
            subject=$(git show -s --format=%s "$head")
            if [ "$base" = - ]; then
              if grep -qx "$head" <(python3 -c 'import json,sys; [print(json.loads(l)["commit"]) for l in open(sys.argv[1])]' .store/records.jsonl 2>/dev/null); then
                echo "$head: already recorded"; continue
              fi
              res="results/$head/result.json"
              python3 /tmp/harness/report.py record .store "$res" "results/$head/runs.jsonl"
              msg="record bench: ${head::7}"
            else
              if [ -f .store/links.jsonl ] && grep -q "\"commit\": \"$head\"" .store/links.jsonl; then
                echo "$head: already linked"; continue
              fi
              res="results/pr-$head/result.json"
              pr=$(echo "$subject" | sed -nE 's/.*\(#([0-9]+)\)\s*$/\1/p')
              python3 /tmp/harness/links.py add .store --commit "$head" --pr "$pr" \
                --result "$res" --runs "results/pr-$head/runs.jsonl" --source backfill
              msg="link bench: ${head::7} (#$pr), backfill"
            fi
            git -C .store add -A
            git -C .store commit -qm "$msg, bench $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bench"])' "$res")"
            recorded=$((recorded + 1))
          done < jobs.txt
          [ "$recorded" -gt 0 ] || { echo "nothing new to record"; exit 0; }
          push_branch bench-results .store
          if [ "$CORPUS_SOURCE" != kept ]; then
            open_branch bench-data .data
            cp "corpus/${CORPUS}.json.gz" .data/
            printf '# Benchmark data\n\nData only, never merged: the CI benchmark'"'"'s corpus, `%s.json.gz`, as\n`bench/ci_corpus.py` builds it (its decoded SHA-256 is pinned there).\n' "$CORPUS" > .data/README.md
            git -C .data add -A
            if git -C .data diff --cached --quiet; then
              echo "bench-data already holds the corpus"
            else
              git -C .data commit -qm "bench data: ${CORPUS}.json.gz"
              push_branch bench-data .data
            fi
          fi
