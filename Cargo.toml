[package]
name = "upigz"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libdeflater = "1"
libz-ng-sys = "1"
libz-rs-sys = "0"
miniz_oxide = "0"
crc32fast = "1"

[build-dependencies]
cc = "1"

[features]
# Counts symbols, matches and copy shapes (one thread, step() instrumented); never timed
census = []
# Research only: the fast loop's accesses unchecked (safety argument in src/fast.rs)
unchecked = []

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
